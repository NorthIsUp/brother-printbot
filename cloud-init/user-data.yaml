#cloud-config
hostname: airprintbot
manage_etc_hosts: true

timezone: America/Los_Angeles


package_update: true
packages:
  - ca-certificates
  - curl
  - zsh

ssh_pwauth: false
enable_ssh: true

users:
  - name: printbot
    groups: [sudo, lpadmin]
    shell: /bin/zsh
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_AUTHORIZED_KEY__


write_files:
  - path: /etc/systemd/system/netplan-ensure.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Ensure netplan config exists
      Before=NetworkManager.service network-pre.target
      Wants=network-pre.target
      DefaultDependencies=no
      
      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'if [ ! -s /etc/netplan/90-NM-*.yaml ]; then /usr/sbin/netplan apply; fi'
      RemainAfterExit=yes
      
      [Install]
      WantedBy=sysinit.target
  - path: /etc/systemd/system/netplan-watch.path
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Watch netplan config for changes
      
      [Path]
      PathChanged=/etc/netplan/
      PathModified=/etc/netplan/
      Unit=netplan-ensure.service
      
      [Install]
      WantedBy=multi-user.target
  - path: /home/printbot/.zshrc
    permissions: '0644'
    owner: printbot:printbot
    defer: true
    content: |
      # Basic zsh configuration
      autoload -Uz compinit && compinit

      export XDG_BIN_HOME=$HOME/.local/bin
      export XDG_CONFIG_HOME=$HOME/.config
      export XDG_DATA_HOME=$HOME/.local/share

      path+=($XDG_BIN_HOME)
      rehash

      # History
      HISTFILE=~/.zsh_history
      HISTSIZE=10000
      SAVEHIST=10000
      setopt SHARE_HISTORY
      
      # Aliases
      alias ll='ls -lah'
      alias grep='grep --color=auto'
      
      # Starship prompt
      (( ${+commands[starship]} )) || { \
          mkdir -p $XDG_BIN_HOME && \
          curl -sS https://starship.rs/install.sh \
          | sh -s -- --bin-dir=$XDG_BIN_HOME -y; \
        }
      eval "$(starship init zsh)"
  - path: /etc/cups/cupsd.conf.d/airprint.conf
    permissions: '0644'
    owner: root:root
    content: |
      <Location />
        Allow @local
      </Location>
      <Location /admin>
        Allow @local
      </Location>
      <Location /admin/conf>
        Allow @local
      </Location>
  - path: /etc/systemd/system/cups-airprint-setup.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Configure CUPS for AirPrint
      After=cups.service
      Wants=cups.service
      
      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/cupsctl --remote-any --share-printers --remote-admin
      ExecStart=/bin/systemctl restart cups
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target
  - path: /etc/network/if-up.d/cups
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/sh
      systemctl restart cups.service
  - path: /usr/local/sbin/install-brother-drivers
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      MODEL="${1:-__BROTHER_MODEL__}"
      BROTHER_IN_ARMS_REF="${BROTHER_IN_ARMS_REF:-master}"
      REPO_DIR="${REPO_DIR:-/opt/brother-in-arms}"
      PRINTER_NAME="${PRINTER_NAME:-BrotherHL4570CDW}"
      PRINTER_URI="${PRINTER_URI:-}"
      PPD_PATH="${PPD_PATH:-}"

      arch="$(dpkg --print-architecture)"
      extra_packages=()
      if [[ "$arch" == "arm64" ]]; then
        dpkg --add-architecture armhf
        extra_packages+=(libc6:armhf libstdc++6:armhf)
      fi

      if [[ -f /etc/os-release ]]; then
        . /etc/os-release
        if [[ "${ID:-}" == "raspbian" || "${ID_LIKE:-}" == *"raspbian"* ]]; then
          extra_packages+=(avahi-daemon avahi-utils usbutils)
        fi
      fi

      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates \
        curl \
        dpkg-dev \
        build-essential \
        gcc \
        git \
        ghostscript \
        make \
        psutils \
        cups \
        cups-bsd \
        cups-client \
        sudo \
        xz-utils \
        zsh \
        "${extra_packages[@]}"

      mkdir -p /var/spool/lpd

      if [[ -d "$REPO_DIR/.git" ]]; then
        git -C "$REPO_DIR" fetch --prune
        git -C "$REPO_DIR" checkout "$BROTHER_IN_ARMS_REF"
        git -C "$REPO_DIR" pull --ff-only
      else
        git clone https://github.com/alexivkin/brother-in-arms.git "$REPO_DIR"
        git -C "$REPO_DIR" checkout "$BROTHER_IN_ARMS_REF"
      fi

      sed -i 's/sudo systemctl restart cups/sudo systemctl restart cups || true/' "$REPO_DIR/oh_brother.zsh"

      zsh "$REPO_DIR/oh_brother.zsh" "$MODEL"

      if [[ -z "${SKIP_CUPS_START:-}" ]]; then
        if command -v systemctl >/dev/null 2>&1; then
          systemctl enable --now cups || systemctl restart cups || true
        elif command -v cupsd >/dev/null 2>&1; then
          if ! lpstat -r 2>/dev/null | grep -q "scheduler is running"; then
            cupsd || true
          fi
        fi
      fi

      wait_for_cups() {
        local attempts=30
        while (( attempts > 0 )); do
          if lpstat -r 2>/dev/null | grep -q "scheduler is running"; then
            return 0
          fi
          sleep 1
          attempts=$(( attempts - 1 ))
        done

        echo "CUPS did not become ready in time." >&2
        return 1
      }

      wait_for_cups || true

      if lpinfo -m 2>/dev/null | grep -qi "HL-4570"; then
        echo "HL-4570 driver appears in CUPS models."
      else
        echo "HL-4570 driver not found in CUPS models." >&2
      fi

      if [[ -f /var/log/cups/error_log ]]; then
        echo "Recent CUPS errors (if any):"
        grep -Ei "hl-4570|brother|ppd|filter|error|unable" /var/log/cups/error_log | tail -n 200 || true
      elif command -v journalctl >/dev/null 2>&1; then
        echo "Recent CUPS journal (filtered):"
        journalctl -u cups --no-pager | grep -Ei "hl-4570|brother|ppd|filter|error|unable" | tail -n 200 || true
      fi

      if [[ -n "$PRINTER_URI" ]]; then
        if [[ -z "$PPD_PATH" ]]; then
          PPD_PATH="$(lpinfo -m | awk '/HL-4570/ {print $1; exit}')"
        fi

        if [[ -n "$PPD_PATH" ]]; then
          lpadmin -p "$PRINTER_NAME" -E -v "$PRINTER_URI" -m "$PPD_PATH"
          if [[ -f /usr/share/cups/data/testprint ]]; then
            lp -d "$PRINTER_NAME" /usr/share/cups/data/testprint || true
          else
            echo "Test page not found at '/usr/share/cups/data/testprint'." >&2
          fi
        else
          echo "PPD not found; set 'PPD_PATH' and re-run." >&2
        fi
      fi

runcmd:
  # global configs
  - | # enable and start netplan ensure and watch
    systemctl enable --now netplan-ensure.service
    systemctl enable --now netplan-watch.path
  - | # install tailscale
    curl -fsSL https://tailscale.com/install.sh | sh
    systemctl enable --now tailscaled || true
    tailscale up --ssh --auth-key=__TS_AUTHKEY__
  - | # enable and start cups airprint setup service
    systemctl enable --now cups-airprint-setup.service
  - | # install brother drivers
    /usr/local/sbin/install-brother-drivers '__BROTHER_MODEL__'
  - | # verify ppd
    lpinfo -m | grep -i hl4570 || true
  # user configs
  - | # mkdirs
    export \
      XDG_CONFIG_HOME=/home/printbot/.config \
      XDG_BIN_HOME=/home/printbot/.local/bin \
      XDG_DATA_HOME=/home/printbot/.local/share

    mkdir -p $XDG_CONFIG_HOME $XDG_BIN_HOME $XDG_DATA_HOME
  - | # install starship prompt and configure
    curl -sS https://starship.rs/install.sh | sh -s -- --bin-dir=$XDG_BIN_HOME -y
    $XDG_BIN_HOME/starship preset gruvbox-rainbow --output $XDG_CONFIG_HOME/starship.toml
  - | # change ownership of home
    chown -R printbot:printbot /home/printbot/
